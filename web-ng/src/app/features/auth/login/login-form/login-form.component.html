<!--
  The login form itself: two labelled fields and one full-width primary submit, exactly as the legacy
  screen renders them (AAP 0.2.3 `LoginForm`; Figma node `1:5`; AAP 0.7.4 "Login"). It is the form
  region only — the language switcher, the lockup, the error region and the footer belong to
  `LoginComponent`, which owns the request this form reports.

  Ids, names and classes are the legacy screen's own (`app/index.html`: `uid`, `pwd`,
  `name="username"`, `name="password"`, `form.form`, `login-button`), so the parity harness addresses
  the same controls on both applications (`web-ng/e2e/pages/next/login.page.ts`) and every
  `<label for>` points at the control it names.

  `novalidate` because the typed reactive form owns validation: the controls carry no `required`
  attribute, so the browser never blocks submission on its own. `form` is the legacy form's class and
  keeps the submit discoverable exactly as it is on the legacy screen.

  The form's own `submit` is handled here rather than left to bubble: the component's output is named
  `submit` because AAP 0.2.3 fixes that name, and the caller binds it on the element that hosts this
  component, so an escaping native `submit` event would arrive at the same binding as an `Event`
  where the caller expects `{username, password}`. `onNativeSubmit` cancels the browser's own
  submission and keeps the event inside this component, which is what makes the output the only way a
  submission leaves the form.

  Every visual value — the uppercase 600 labels, the 34px field with its 1px input border and 2px
  radius, the brand-blue full-width button and Bootstrap's own `.has-error`/`.help-block` invalid
  treatment — is the global layer compiled in `web-ng/src/styles.scss`, so this template carries no
  stylesheet, no style attribute, no colour and no pixel (Rule 1 clause 6).

  BLITZY [COPY]: each placeholder is the field's own translation key, so it renders in the active
  language exactly as the label does, but in sentence case where the design prints "username" and
  "password" in lower case — the legacy screen lower-cased the same key with AngularJS's
  `| lowercase` filter, and the alternatives here are worse: the component imports no lower-case pipe,
  and Bootstrap's `.text-lowercase` on the field would also lower-case what the user types.
-->
<form class="form" [formGroup]="form" (submit)="onNativeSubmit($event)" novalidate>
  <div
    class="form-group"
    [class.has-error]="
      form.controls.username.invalid &&
      (form.controls.username.touched || form.controls.username.dirty)
    "
  >
    <label class="form-label" for="uid">{{ 'label.input.username' | translate }}</label>
    <input
      id="uid"
      name="username"
      type="text"
      class="form-control"
      formControlName="username"
      [attr.placeholder]="'label.input.username' | translate"
      [attr.aria-required]="true"
      [attr.aria-invalid]="
        form.controls.username.invalid && form.controls.username.touched ? 'true' : null
      "
      [attr.aria-describedby]="
        form.controls.username.invalid && form.controls.username.touched ? 'uid-error' : null
      "
    />
    @if (form.controls.username.invalid && form.controls.username.touched) {
      <span id="uid-error" class="help-block">
        {{ 'label.requiredfield' | translate }}
      </span>
    }
  </div>

  <div
    class="form-group"
    [class.has-error]="
      form.controls.password.invalid &&
      (form.controls.password.touched || form.controls.password.dirty)
    "
  >
    <label class="form-label" for="pwd">{{ 'label.input.password' | translate }}</label>
    <!--
      `type="password"` and the legacy screen's own `autocomplete="new-password"`: the value is
      masked on screen and never echoed, logged or captured (Rule 1 clause 9). This template owns no
      second copy of the credential, so nothing here can leak it.
    -->
    <input
      id="pwd"
      name="password"
      type="password"
      class="form-control"
      formControlName="password"
      autocomplete="new-password"
      [attr.placeholder]="'label.input.password' | translate"
      [attr.aria-required]="true"
      [attr.aria-invalid]="
        form.controls.password.invalid && form.controls.password.touched ? 'true' : null
      "
      [attr.aria-describedby]="
        form.controls.password.invalid && form.controls.password.touched ? 'pwd-error' : null
      "
    />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <span id="pwd-error" class="help-block">
        {{ 'label.requiredfield' | translate }}
      </span>
    }
  </div>

  <div class="form-group">
    <!--
      One full-width primary submit. `[disabled]="busy()"` is the whole duplicate-submission guard:
      the screen sets it from its submit guard while `POST /authentication` is in flight, because
      that endpoint is not idempotent and one click sends exactly one request (AAP 0.14.1), and no
      second spinner, overlay or flag is added beside it.
    -->
    <button id="login-button" type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
      {{ 'label.button.signin' | translate }}
    </button>
  </div>
</form>
