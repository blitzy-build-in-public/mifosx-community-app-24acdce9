<!--
  The list toolbar (AAP 0.2.3 component inventory row `FilterToolbar`, Figma node `1:3`): the
  client-side filter, the find field with its search button, the "Show Closed" checkbox and the
  permission-gated "Create Client" control, in the legacy screen's own two-column row
  (`app/views/clients/clients.html:20-40`; Rule 1 clause 3).

  The markup is the legacy layout verbatim: `.form-horizontal` > `.form-group` > two columns for the
  fields, `.input-group` with `.input-group-btn` for the find field and its button, `.checkbox
  .form-control` for the boxed choice, and `a.btn.btn-primary.pull-right` for the primary action.
  Nothing here paints a colour, a size or a spacing of its own: every one of them is the global
  Bootstrap 3 layer's, which is what keeps the toolbar looking like the legacy one (Rule 1 clause 6).

  The three controls are the toolbar's own typed form. Submitting it publishes the find text; the
  filter field and the checkbox publish as they change; the create control publishes its activation
  while its `routerLink` and its `hasPermission` gate stay declarative. The screen that owns the rows
  decides what each publication does (AAP 0.2.3 row `FilterToolbar`).
-->
<div class="row">
  <div class="col-sm-8">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-horizontal">
      <div class="form-group">
        <div class="col-md-4">
          <!--
            The two text controls carry the legacy field's own placeholder and, in addition, the same
            words as an `aria-label`: a placeholder is not a label, so the associated name is what a
            screen reader announces for the field. The label is invisible — no pixel changes — and
            reuses the bundle's own words rather than inventing copy.
          -->
          <input
            type="text"
            class="form-control"
            id="filterText"
            name="filterText"
            formControlName="filter"
            [placeholder]="'label.input.filterbynameaccno' | translate"
            [attr.aria-label]="'label.input.filterbynameaccno' | translate"
          />
        </div>
        <div class="col-md-8">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              id="find"
              name="find"
              formControlName="find"
              [placeholder]="'label.input.searchByNameAccNo' | translate"
              [attr.aria-label]="'label.input.searchByNameAccNo' | translate"
            />
            <span class="input-group-btn">
              <!--
                The button's only content is the search glyph, which is decorative, so the accessible
                name comes from the legacy bundle's own word for it rather than from the icon (AAP
                0.7.4's find control; Rule 1 clause 6). It disables while a read is in flight, so one
                click sends one request (AAP 0.1.1 "duplicate-submission protection").
              -->
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="busy()"
                [attr.aria-label]="'label.heading.search' | translate"
              >
                <i class="fa fa-search" aria-hidden="true"></i>
              </button>
            </span>
            <!--
              `showAll` is the legacy checkbox's own id (`app/views/clients/clients.html:34`), so the
              harness addresses the same control on both applications and the `label for` points at
              the input it names. The browser draws the box itself; the stylesheet declares no rule
              for it, because the design shows the native control (AAP 0.5.2).
            -->
            <div class="checkbox form-control">
              <label for="showAll">
                <input type="checkbox" id="showAll" name="showAll" formControlName="showClosed" />
                &nbsp;{{ 'label.button.showall' | translate }}
              </label>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="col-sm-4">
    <!--
      "Create Client" — the entry point of workflow W2 and the only action this card offers. It is
      permission-gated on the legacy code `CREATE_CLIENT` and the gate fails closed, so a user
      without the permission is not offered a control the route would refuse (AAP 0.7.4; AAP 0.9.1
      item 1). The "Import Clients" button the legacy screen renders beside it belongs to
      out-of-scope bulk import and is deliberately absent (AAP 0.10.5 item 4). The control sits in
      the toolbar's right-hand column, which is where the legacy markup and the design place it. The
      navigation is the link's own; the click only reports the activation.
    -->
    <a
      routerLink="/createclient"
      class="btn btn-primary pull-right"
      hasPermission="CREATE_CLIENT"
      (click)="onCreate()"
    >
      <i class="fa fa-plus" aria-hidden="true"></i>
      {{ 'label.button.createclient' | translate }}
    </a>
  </div>
</div>
