<!-- The record card is the card: these rows are its content, so no nested .panel — its fill, border and shadow would paint a second card the design does not show. -->
<!-- BLITZY [DESIGN_SYSTEM_GAP]: .control-label declares no font-weight of its own outside a
     .form-horizontal form — Bootstrap's 700 comes from the `label` element — so this key column
     renders at body weight until the global stylesheet gives the class a weight of its own. -->
@for (row of rows(); track row.label) {
  <div class="row">
    <div class="col-md-4"><span class="control-label">{{ row.label }}</span></div>
    <!-- A field the payload omits renders an empty value column, the way the record shows it, so the
         cell carries no fallback: no dash, "N/A", em dash or muted stand-in text. -->
    <div class="col-md-8">{{ row.value }}</div>
  </div>
}
<!-- The fifth and last row is the activation date, the block's only date: it renders at the one
     display pattern the record uses, taken from the component rather than written as a literal. -->
<div class="row">
  <div class="col-md-4"><span class="control-label">Activation Date</span></div>
  <div class="col-md-8">{{ activationDate() | date: displayDateFormat }}</div>
</div>
