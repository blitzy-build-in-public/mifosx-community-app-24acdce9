<!-- The header strip of the client record: the status indicator, the client name and the three inline metadata runs, closed by a rule (Figma flow "Sign in and open a client record", step 3 of 3, screen 1:4 of file (AAP 0.2.3, AAP 0.7.4, Rule 1 clause 6, AAP 0.10.5). -->
<!--
  The client's name is the record's `h1` — the screen's own title, and the only one — while
  `.record-title` keeps the 24px/700 the design measures, so the level moves the document outline and
  not a pixel (AAP 0.2.3, AAP 0.2.2). The name keeps its `<strong>`, as the delivered
  markup has it.
-->
<h1 class="record-title">
  <app-status-swatch [status]="statusKey()" variant="dot" />{{ ' ' }}<strong>{{ client().displayName }}</strong>
</h1>

<div class="small text-small">
  @for (run of metadataRuns(); track run.labelKey) {
    <span>{{ run.labelKey | translate }}:</span>{{ ' ' }}<span>{{ run.value }}</span>@if (!$last) {
      {{ ' ' }}<span aria-hidden="true">|</span>{{ ' ' }}
    }
  }
</div>

<hr class="section-rule" />
