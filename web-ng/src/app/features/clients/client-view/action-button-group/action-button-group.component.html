<!-- The joined action row of the individual client record — the `ActionButtonGroup` row of the component inventory (AAP 0.2.3), an element of the record screen in the "Sign in and open a client record" flow (Figma node (AAP 0.5.2, AAP 0.7.4, Rule 1 clause 6, AAP 0.4.4). -->
<div class="btn-group" role="group">
  <!-- The entries of the visible row, in the parent's order and with nothing added here: a row the plan keeps out of scope cannot appear, because no descriptor names it (AAP 0.10.5 items 5 and 7). -->
  @for (action of topLevelActions(); track action.routerLink) {
    <a class="btn btn-primary" [routerLink]="action.routerLink" [hasPermission]="action.permission">
      @if (action.icon) {
        <i class="fa {{ action.icon }}" aria-hidden="true"></i>{{ ' ' }}
      }
      {{ action.label | translate }}
    </a>
  }

  <!--
    The `More` menu, rendered only when the record's own status gives it at least one entry: an active
    client's state answers no menu command, so the record shows its row alone rather than a trigger
    that opens an empty list (AAP 0.7.4; Rule 1 clause 3). Bootstrap's own rule keeps the list hidden
    until the `open` class is set, so the menu needs no conditional of its own, and Escape inside the
    group closes it without opening it. A click anywhere outside the group closes it as well, through
    the document listener the component's `host` block installs, which is what legacy's Bootstrap
    dropdown did (Rule 1 clause 3).
  -->
  @if (menuActions().length > 0) {
    <div class="btn-group dropdown" [class.open]="moreOpen()" (keydown.escape)="closeMore()">
      <button type="button" class="btn btn-primary dropdown-toggle" aria-haspopup="true" [attr.aria-expanded]="moreOpen()" (click)="toggleMore()">
        {{ 'label.button.more' | translate }}{{ ' ' }}<span class="caret" aria-hidden="true"></span>
      </button>
      <ul class="dropdown-menu" role="menu">
        @for (action of menuActions(); track action.routerLink) {
          <li role="none">
            <a role="menuitem" [routerLink]="action.routerLink" [hasPermission]="action.permission">{{ action.label | translate }}</a>
          </li>
        }
      </ul>
    </div>
  }
</div>
