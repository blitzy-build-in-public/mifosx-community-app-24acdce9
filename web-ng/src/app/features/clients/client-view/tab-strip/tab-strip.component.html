<!-- An empty tab list renders nothing at all. Unguarded, the two decorative chevrons alone would
     still give the strip its height and `.nav-tabs` its 1px bottom border, painting an empty shell
     around no tab. -->
@if (tabs().length > 0) {
  <ul class="nav nav-tabs">
    <!-- The design's two scroll chevrons are inert decoration: every tab the record keeps fits
         the row, so they carry no handler and stay out of the accessibility tree rather than
         presenting a control that does nothing. Bootstrap's own float utility parks the right
         one at the strip's end, so the pair brackets the tabs instead of trailing the last. -->
    <li aria-hidden="true"><i class="fa fa-chevron-left text-primary"></i></li>
    @for (tab of tabs(); track tab.id) {
      <!-- The tab is the plain `li` and `a` legacy's tabset renders inside a `ul.nav.nav-tabs`,
           with `.active` on the `li` as its only state — the markup AAP 0.5.2 maps the strip to.
           The anchor carries legacy's own valueless `href`: angular-bootstrap 1.3.2, the version
           legacy pins, renders `<a href ng-click="select($event)">`, so the tab is a link exactly as
           legacy's is — in the tab order, activated by Enter as any link is, and carrying the
           pointer cursor a link gets (Bootstrap keeps the active tab `cursor: default`, as legacy
           shows). No role, tab stop attribute or selection state is layered on top of it: AAP 0.10.5
           registers no accessibility difference from legacy here, and Rule 1 clause 3 forbids an
           unregistered one. `select` cancels the click's default, so the hash route cannot change —
           the treatment `client-list.component.ts`'s `goToPage` documents for the pager. -->
      <li [class.active]="tab.id === activeId()">
        <a href="" (click)="select($event, tab)">{{ tab.label }}</a>
      </li>
    }
    <li class="pull-right" aria-hidden="true"><i class="fa fa-chevron-right text-primary"></i></li>
  </ul>
}
