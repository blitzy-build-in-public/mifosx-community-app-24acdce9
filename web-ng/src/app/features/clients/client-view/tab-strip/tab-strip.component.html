<!-- An empty tab list renders nothing at all. Unguarded, the two decorative chevrons alone would still give the strip its height and `.nav-tabs` its 1px bottom border, painting an empty shell around no tab. -->
@if (tabs().length > 0) {
  <ul class="nav nav-tabs">
    <!-- The design's two scroll chevrons are inert decoration: every tab the record keeps fits the row, so they carry no handler and stay out of the accessibility tree rather than presenting a control that does nothing. -->
    <li aria-hidden="true"><i class="fa fa-chevron-left text-primary"></i></li>
    @for (tab of tabs(); track tab.id) {
      <!-- The tab is the plain `li` and `a` legacy's tabset renders inside a `ul.nav.nav-tabs`, with `.active` on the `li` as its only state — the markup AAP 0.5.2 maps the strip to (AAP 0.10.5, Rule 1 clause 3). -->
      <li [class.active]="tab.id === activeId()">
        <a href="" (click)="select($event, tab)">{{ tab.label }}</a>
      </li>
    }
    <li class="pull-right" aria-hidden="true"><i class="fa fa-chevron-right text-primary"></i></li>
  </ul>
}
