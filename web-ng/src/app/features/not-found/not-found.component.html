<!-- The unknown-path screen: the counterpart of the legacy application's `.otherwise` route, which renders `views/errors/404.html`, and the message a 404 from a single record endpoint puts in place of the record (AAP 0.10.2, AAP 0.9.1, Rule 1 clause 3). -->
<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <div class="panel">
        <div class="panel-body text-center">
          <h1 class="panel-title">{{ 'label.heading.notavailable' | translate }}</h1>
          <p>{{ 'error.msg.resource.not.found' | translate }}</p>
          <p><a class="btn btn-primary" routerLink="/clients">{{ 'label.button.clients' | translate }}</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
