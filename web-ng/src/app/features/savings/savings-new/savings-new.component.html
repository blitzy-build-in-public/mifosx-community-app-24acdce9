<!-- New savings application (`#/new_client_saving_application/:clientId`), the first step of workflow W8: the product and the submission date above Submit and Cancel (AAP 0.7.2 `SavingsApplicationRequest`, AAP 0.7.4 (AAP 0.8.2, Rule 1 clause 6). -->
<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      @if (notFound()) {
        <!-- No client on the route: the message replaces the card, so no control is rendered and nothing is posted. Fineract's own resource-not-available text, the same key `loan-new` uses rather than a locally written sentence (AAP 0.7.4 states). -->
        <div class="panel">
          <div class="panel-body">
            <p class="text-center text-muted">{{ 'error.msg.resource.not.found' | translate }}</p>
          </div>
        </div>
      } @else {
        <div class="panel">
          <div class="panel-heading">
            <h3 class="panel-title">{{ 'label.heading.savingapplication' | translate }}</h3>
          </div>
          <div class="panel-body">
            <!-- Fineract's own failure text, verbatim, above the form, whose values survive it (W7). -->
            @if (error(); as message) {
              <div class="alert alert-danger" role="alert">{{ message }}</div>
            }

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="row">
                <div class="col-md-6">
                  <app-select-field
                    inputId="savings-product"
                    [label]="productLabel()"
                    [options]="productOptions()"
                    [control]="form.controls.productId"
                    [placeholder]="productPlaceholder()"
                    [required]="true"
                  />
                </div>
                <div class="col-md-6">
                  <app-date-field
                    inputId="savings-submitted-on"
                    [label]="submittedOnDateLabel()"
                    [control]="form.controls.submittedOnDate"
                    [required]="true"
                  />
                </div>
              </div>

              <!-- The legacy `Details` step also offers a field-officer picker, and this form renders none: the creation body AAP 0.7.2 fixes carries `clientId`, `productId`, `submittedOnDate`, `dateFormat` and `locale` and no officer member, and AAP 0.10.5 item 5 keeps staff assignment out of scope. Rendering the picker would be a control that discards the operator's choice — a deliberate difference Rule 1 clause 3 allows when it is stated, as it is here. -->

              <div class="form-group">
                <button type="button" class="btn btn-default" (click)="cancel()">
                  {{ 'label.button.cancel' | translate }}
                </button>
                <!-- Disabled while the post is in flight: one click sends one `POST /savingsaccounts`. -->
                <button type="submit" class="btn btn-primary" [disabled]="guard.busy()">
                  {{ 'label.button.submit' | translate }}
                </button>
              </div>
            </form>
          </div>
        </div>
      }
    </div>
  </div>
</div>
