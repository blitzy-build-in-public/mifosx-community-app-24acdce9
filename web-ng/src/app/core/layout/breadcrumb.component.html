@if (items().length > 0) {
  <!--
    BLITZY [A11Y]: the trail sits in a navigation landmark named "Breadcrumb", which is the treatment
    the client record already gives its own trail (`client-view.component.html`) applied to every
    screen (QA report F41). The wrapper adds no box of its own — `nav` is a plain block with no margin,
    and `.breadcrumb` keeps the 2px padding, the 4px bottom margin and the 21px height the trail
    paints — so no pixel moves and no behaviour changes.

    It does depart from legacy, which renders the bare list with no landmark around it
    (`app/views/clients/clients.html` opens with the list) and so from Rule 1 clause 3's reading of
    that markup as the thing to reproduce: the checkpoint's accessibility checks require a named
    navigation landmark on every screen, and this wrapper is what meets that requirement.
  -->
  <nav aria-label="Breadcrumb">
    <ol class="breadcrumb">
      @for (item of items(); track $index) {
        <!-- The last crumb is the current page, marked the one way legacy marks it: Bootstrap 3's `.breadcrumb > .active` class, which legacy writes as `<li class="active">` and which is the only rule that gives the current crumb. -->
        <li [class.active]="$last">{{ item.label }}</li>
      }
    </ol>
  </nav>
}
