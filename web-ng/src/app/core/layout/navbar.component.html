<!--
  The signed-in navigation bar (AAP 0.2.3 `Navbar`, AAP 0.7.4, Figma node `1:3`).

  Bootstrap 3's own navbar markup, reduced to the destinations this migration keeps in scope. It
  renders exactly five things — the brand lockup, the "Clients" destination, the global search, the
  language switcher and the user menu with its sign-out — because every other control the legacy
  navbar carries opens an out-of-scope module: the legacy hamburger only collapses the left icon
  rail, the bell opens the legacy notification tray, and "Accounting", "Reports" and "Admin" lead to
  modules that stay on the legacy application during cutover. None of them is drawn, stubbed or
  linked (AAP 0.9.2, AAP 0.10.5 items 4 and 8).

  No Bootstrap JavaScript is loaded (jQuery is forbidden in this build), so nothing here relies on
  `data-toggle`: the dropdown is opened by the `.open` class bound to the component's signal.

  Every visual value — the 50px height, the #FFFFFF fill, the 1px #DFDFDF bottom border, the
  #5099ED link colour, the 30px search control and the brand image's sizing — is a global rule in
  web-ng/src/styles.scss and on the Bootstrap classes named below; this template declares no style
  attribute, no hex value and no dimension beyond the brand image's intrinsic width and height.
-->
<nav class="navbar navbar-default" role="navigation">
  <div class="container-fluid">
    <!--
      The brand lockup, served in place from the legacy tree through the `images/` asset mapping:
      MifosX_logoSmall.png is the navbar cut of the legacy logo, 53x20 CSS px (AAP 0.2.4). It is an
      informative image, so it keeps legacy's alt text; the explicit width and height keep the row
      from reflowing while the file loads. The logo links to the legacy home route, which redirects
      to the clients list because the dashboard is out of scope (AAP 0.10.5 item 3).
    -->
    <div class="navbar-header">
      <a class="navbar-brand" routerLink="/home">
        <img src="images/MifosX_logoSmall.png" alt="Mifos X" width="53" height="20" />
      </a>
    </div>

    <!--
      `.navbar-collapse` without the `.collapse` class: Bootstrap 3 hides a collapsed navigation
      only while it also carries `.collapse`, and this application renders no hamburger to expand
      one, so the navigation must stay visible at every width instead of disappearing below 768px.
    -->
    <div class="navbar-collapse">
      <ul class="nav navbar-nav" id="main-menu-left">
        <!--
          The single in-scope destination. `hasPermission` hides the item rather than removing it
          when the signed-in user lacks the code, which is what the legacy `has-permission`
          directive did; the code itself (`READ_CLIENT`) is declared on the component and is the one
          the clients route group carries in its `data.permission`, so the menu item and the route
          guard cannot disagree (AAP 0.14.1). Navigation goes through `routerLink` — never a hash
          `href` — so the router owns the URL (Rule 1 clause 5).
        -->
        <li [hasPermission]="clientPermission">
          <a routerLink="/clients">
            <i class="fa fa-users" aria-hidden="true"></i> {{ 'label.anchor.clients' | translate }}
          </a>
        </li>
      </ul>

      <!--
        The user menu, right-aligned. Order in the source is the order the floats resolve in: this
        list is declared first, so it takes the right-hand end of the bar and the search control
        declared after it lands to its left, as the design shows (search, language, user menu).
      -->
      <ul class="nav navbar-nav navbar-right" id="main-menu-right">
        <li class="dropdown" [class.open]="userMenuOpen()" (keydown.escape)="closeUserMenu()">
          <!--
            The label is the authenticated account name from `GET /users/{id}` — `mifos` after a
            login as `mifos` — which is the value legacy prints from `currentSession.user.name` in
            this same place, and it is the only session-derived value this component displays
            (Rule 1 clause 9).

            An anchor rather than a native button because `.navbar-nav > li > a` is the Bootstrap
            rule that paints the design's #5099ED label; `role="button"` plus `tabindex` and the
            Enter/Space handlers give it the button's keyboard behaviour without that colour being
            lost, and legacy's own toggle is an anchor of the same shape.
          -->
          <a
            #userMenuTrigger
            id="user-dropdown"
            class="dropdown-toggle"
            role="button"
            tabindex="0"
            aria-haspopup="true"
            [attr.aria-expanded]="userMenuOpen()"
            (click)="toggleUserMenu()"
            (keydown.enter)="toggleUserMenu()"
            (keydown.space)="toggleUserMenu(); $event.preventDefault()"
          >
            {{ username() }} <span class="caret"></span>
          </a>

          <!--
            The menu holds one entry: sign-out. Legacy's other entries — help, profile and settings
            — open screens that stay on the legacy application, so they are absent rather than
            rendered and refused (AAP 0.10.5 item 8). `role="menu"`/`role="menuitem"` name the
            structure for assistive technology and change nothing on screen.
          -->
          <ul class="dropdown-menu" role="menu" aria-labelledby="user-dropdown">
            <li role="none">
              <a
                id="logout"
                role="menuitem"
                tabindex="0"
                (click)="signOut()"
                (keydown.enter)="signOut()"
                (keydown.space)="signOut(); $event.preventDefault()"
              >
                <i class="fa fa-power-off" aria-hidden="true"></i>
                {{ 'label.anchor.logout' | translate }}
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!--
        The language switcher. Its list is the application's single `AVAILABLE_LANGS`, shared with
        the login screen's switcher, and each option shows the language code the bundles are named
        by (`global-translations/locale-<code>.json`); a switch is `TranslateService.use()`, so no
        page reload and no navigation (AAP 0.7.4). The control is a native `<select>` — the
        Angular-native replacement for the jQuery plugin the request forbids (AAP 0.10.5 item 2) —
        and `(change)` reports the selected value through the template reference rather than
        reaching into the event object; the reference is also what lets the component reconcile the
        control with the language actually in force when a bundle cannot be loaded.
      -->
      <div class="navbar-form navbar-right">
        <label class="text-small" for="navbar-language">{{ 'label.heading.language' | translate }}</label>
        <select
          #languageSelect
          id="navbar-language"
          class="form-control"
          [value]="currentLang()"
          (change)="onLangChange(languageSelect.value, languageSelect)"
        >
          @for (language of langs; track language) {
            <option [value]="language">{{ language }}</option>
          }
        </select>
      </div>

      <!--
        The global search control, which emits the trimmed query and the selected scope and never
        issues a request of its own (AAP 0.2.3 `GlobalSearch`). The component's own form is a
        `.navbar-form navbar-right`, so it sits to the left of the two controls above and inherits
        the 30px height of the global `.navbar .form-control` rule.
      -->
      <app-global-search (search)="onSearch($event)" />
    </div>
  </div>
</nav>
