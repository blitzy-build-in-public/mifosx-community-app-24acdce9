<!--
  The signed-in navigation bar (AAP 0.2.3 `Navbar`, AAP 0.7.4, Figma node `1:3`).

  Bootstrap 3's own navbar markup, reduced to the destinations this migration keeps in scope. It
  renders exactly five things — the brand lockup, the "Clients" destination, the global search, the
  language switcher and the user menu with its sign-out — because every other control the legacy
  navbar carries opens an out-of-scope module: the legacy hamburger only collapses the left icon
  rail, the bell opens the legacy notification tray, and "Accounting", "Reports" and "Admin" lead to
  modules that stay on the legacy application during cutover. None of them is drawn, stubbed or
  linked (AAP 0.9.2, AAP 0.10.5 items 4 and 8).

  No Bootstrap JavaScript is loaded (jQuery is forbidden in this build), so no dropdown-plugin
  attribute appears here: the menu is opened by the `.open` class bound to the component's signal.

  Every visual value — the bar's height and surface, its bottom rule, the nav link colour, the search
  control's height, the language switcher's label size over its native select, and the brand image's
  sizing — is a global rule in web-ng/src/styles.scss and on the Bootstrap classes named below; this
  template declares no style attribute, no colour value and no dimension, and the AAP 0.2.2 token
  each rule implements is named where the element that wears it is described.
-->
<nav class="navbar navbar-default">
  <div class="container-fluid">
    <!--
      The brand lockup, served in place from the legacy tree through the `images/` asset mapping:
      MifosX_logoSmall.png is the navbar cut of the legacy logo (AAP 0.2.4). It is an informative
      image, so it keeps legacy's alt text. The template states no width and no height: the global
      `.navbar-brand img` rule of web-ng/src/styles.scss governs the rendered width and the file's
      own aspect ratio the height, so the lockup is never stretched and no dimension is repeated
      here.

      The lockup opens the clients list directly rather than legacy's `#/home`: the dashboard is out
      of scope and `/home` only redirects to `/clients` (AAP 0.10.5 item 3), so the brand lands on the
      in-scope landing screen in one hop instead of two.
    -->
    <div class="navbar-header">
      <a class="navbar-brand" routerLink="/clients">
        <img src="images/MifosX_logoSmall.png" alt="Mifos X" />
      </a>
    </div>

    <!-- `.navbar-collapse` without the `.collapse` class: Bootstrap 3 hides a collapsed navigation only while it also carries `.collapse`, and this application renders no hamburger to expand one, so the navigation must stay visible at every width instead of disappearing below Bootstrap's own collapse breakpoint. -->
    <div class="navbar-collapse">
      <ul class="nav navbar-nav" id="main-menu-left">
        <!--
          The single in-scope destination. `hasPermission` hides the item rather than removing it
          when the signed-in user lacks the code, which is what the legacy `has-permission`
          directive did; the code itself (`READ_CLIENT`) is declared on the component and is the one
          the clients route group carries in its `data.permission`, so the menu item and the route
          guard cannot disagree (AAP 0.14.1). Navigation goes through `routerLink` — never a hash
          `href` — so the router owns the URL (Rule 1 clause 5).
        -->
        <li [hasPermission]="clientPermission">
          <a routerLink="/clients">
            <i class="fa fa-users" aria-hidden="true"></i> {{ 'label.anchor.clients' | translate }}
          </a>
        </li>
      </ul>

      <!-- The user menu, right-aligned. Order in the source is the order the floats resolve in: this list is declared first, so it takes the right-hand end of the bar and the search control declared after it lands to its left, as the design shows (search, language, user menu). -->
      <ul class="nav navbar-nav navbar-right" id="main-menu-right">
        <li class="dropdown" [class.open]="userMenuOpen()" (keydown.escape)="closeUserMenu()">
          <!--
            The label is the authenticated account name from `GET /users/{id}` — `mifos` after a
            login as `mifos` — which is the value legacy prints from `currentSession.user.name` in
            this same place, or the name the signed-in shell handed in when it supplied one; it is
            the only session-derived value this component displays (Rule 1 clause 9).

            An anchor rather than a native button because `.navbar-nav > li > a` is the Bootstrap
            rule that paints the design's brand-blue label (AAP 0.2.2 `color-brand-blue`);
            `role="button"` plus `tabindex` and the Enter/Space handlers give it the button's keyboard
            behaviour without that colour being lost, and legacy's own toggle is an anchor of the same
            shape.
          -->
          <a
            #userMenuTrigger
            id="user-dropdown"
            class="dropdown-toggle"
            role="button"
            tabindex="0"
            aria-haspopup="true"
            [attr.aria-expanded]="userMenuOpen()"
            (click)="toggleUserMenu()"
            (keydown.enter)="toggleUserMenu()"
            (keydown.space)="toggleUserMenu(); $event.preventDefault()"
          >
            {{ displayName() }} <span class="caret"></span>
          </a>

          <!-- The menu holds one entry: sign-out. Legacy's other entries — help, profile and settings — open screens that stay on the legacy application, so they are absent rather than rendered and refused (AAP 0.10.5 item 8). `role="menu"`/`role="menuitem"` name the structure for assistive technology and change nothing on screen. -->
          <ul class="dropdown-menu" role="menu" aria-labelledby="user-dropdown">
            <li role="none">
              <a
                id="logout"
                role="menuitem"
                tabindex="0"
                (click)="onSignOut()"
                (keydown.enter)="onSignOut()"
                (keydown.space)="onSignOut(); $event.preventDefault()"
              >
                <i class="fa fa-power-off" aria-hidden="true"></i>
                {{ 'label.anchor.logout' | translate }}
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!--
        The language switcher, the navbar's row of the shared `LanguageSwitcherComponent`
        (AAP 0.2.3 `LanguageSwitcher`, AAP 0.10.5 item 14): the application's single
        `AVAILABLE_LANGS`, the language actually in force, and legacy's own "Language" label, with
        each option showing the code the bundles are named by
        (`global-translations/locale-<code>.json`). The component owns the switch — one
        `TranslateService.use()`, no page reload and no navigation (AAP 0.7.4) — and reconciles its
        selector with the language in force when a bundle cannot be loaded; the bar reports both
        outcomes through `(langChange)` and `(langChangeFailed)`.

        Its placement is unchanged: the host element carries the `navbar-form navbar-right` pair the
        inline row carried, so the control still floats to the left of the user menu and keeps the
        navbar's form spacing. The row's own `.language-switcher` styling stays in
        `web-ng/src/styles.scss`, so this template declares no style, no colour and no dimension
        (Rule 1 clause 6).
      -->
      <app-language-switcher
        class="navbar-form navbar-right"
        [langs]="langs"
        [current]="currentLang()"
        labelKey="label.heading.language"
        selectId="navbar-language"
        (langChange)="onLangChange($event)"
        (langChangeFailed)="onLangChangeFailed()"
      />

      <!--
        The global search control, seeded with the `searchScope` this bar was given and emitting the
        trimmed query and the selected scope; it never issues a request of its own (AAP 0.2.3
        `GlobalSearch`'s `query`/`scope`/`(search)` props). The component's own form is a
        `.navbar-form navbar-right`, so it sits to the left of the two controls above and takes the
        navbar control height of the global `.navbar .form-control` rule.
      -->
      <app-global-search [scope]="searchScope()" (search)="onSearch($event)" />
    </div>
  </div>
</nav>
