<!-- The signed-in navigation bar (AAP 0.2.3 `Navbar`, AAP 0.7.4, Figma node `1:3`) (AAP 0.9.2, AAP 0.10.5, AAP 0.2.2). -->
<nav class="navbar navbar-default">
  <div class="container-fluid">
    <!-- The brand lockup, served in place from the legacy tree through the `images/` asset mapping: MifosX_logoSmall.png is the navbar cut of the legacy logo (AAP 0.2.4) (AAP 0.10.5). -->
    <div class="navbar-header">
      <a class="navbar-brand" routerLink="/clients">
        <img src="images/MifosX_logoSmall.png" alt="Mifos X" />
      </a>
    </div>

    <!-- `.navbar-collapse` without the `.collapse` class: Bootstrap 3 hides a collapsed navigation only while it also carries `.collapse`, and this application renders no hamburger to expand one, so the navigation must stay. -->
    <div class="navbar-collapse">
      <ul class="nav navbar-nav" id="main-menu-left">
        <!-- The single in-scope destination. `hasPermission` hides the item rather than removing it when the signed-in user lacks the code, which is what the legacy `has-permission` directive did; the code itself (`READ_CLIENT`) is (AAP 0.14.1, Rule 1 clause 5). -->
        <li [hasPermission]="clientPermission">
          <a routerLink="/clients">
            <i class="fa fa-users" aria-hidden="true"></i> {{ 'label.anchor.clients' | translate }}
          </a>
        </li>
      </ul>

      <!-- The user menu, right-aligned. Order in the source is the order the floats resolve in: this list is declared first, so it takes the right-hand end of the bar and the search control declared after it lands to its left, as. -->
      <ul class="nav navbar-nav navbar-right" id="main-menu-right">
        <li class="dropdown" [class.open]="userMenuOpen()" (keydown.escape)="closeUserMenu()">
          <!-- The label is the authenticated account name from `GET /users/{id}` — `mifos` after a login as `mifos` — which is the value legacy prints from `currentSession.user.name` in this same place, or the name the signed-in (Rule 1 clause 9, AAP 0.2.2). -->
          <a
            #userMenuTrigger
            id="user-dropdown"
            class="dropdown-toggle"
            role="button"
            tabindex="0"
            aria-haspopup="true"
            [attr.aria-expanded]="userMenuOpen()"
            (click)="toggleUserMenu()"
            (keydown.enter)="toggleUserMenu()"
            (keydown.space)="toggleUserMenu(); $event.preventDefault()"
          >
            {{ displayName() }} <span class="caret"></span>
          </a>

          <!-- The menu holds one entry: sign-out. Legacy's other entries — help, profile and settings — open screens that stay on the legacy application, so they are absent rather than rendered and refused (AAP 0.10.5 item 8). -->
          <ul class="dropdown-menu" role="menu" aria-labelledby="user-dropdown">
            <li role="none">
              <a
                id="logout"
                role="menuitem"
                tabindex="0"
                (click)="signOut()"
                (keydown.enter)="signOut()"
                (keydown.space)="signOut(); $event.preventDefault()"
              >
                <i class="fa fa-power-off" aria-hidden="true"></i>
                {{ 'label.anchor.logout' | translate }}
              </a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- The language switcher. Its list is the application's single `AVAILABLE_LANGS`, shared with the login screen's switcher, and each option shows the language code the bundles are named by (AAP 0.7.4, AAP 0.10.5, AAP 0.2.3). -->
      <div class="navbar-form navbar-right language-switcher">
        <label for="navbar-language">{{ 'label.heading.language' | translate }}</label>
        <select
          #languageSelect
          id="navbar-language"
          class="btn btn-default btn-xs"
          [value]="currentLang()"
          (change)="onLangChange(languageSelect.value, languageSelect)"
        >
          @for (language of langs; track language) {
            <option [value]="language" [selected]="language === currentLang()">{{ language }}</option>
          }
        </select>
      </div>

      <!-- The global search control, which emits the trimmed query and the selected scope and never issues a request of its own (AAP 0.2.3 `GlobalSearch`). -->
      <app-global-search (search)="onSearch($event)" />
    </div>
  </div>
</nav>
