<!--
  The signed-in shell (AAP 0.2.3 `AppShell`, AAP 0.7.1 and AAP 0.8.2 "Shell and navigation"), which
  `app.routes.ts` renders behind its authenticated layout route.

  Order is the design's: the 50px navigation bar, then the idle warning while a session is about to
  expire, then the #EBEFF1 content surface holding the breadcrumb and the routed screen. No left icon
  rail, no Accounting / Reports / Admin destination, no hamburger and no notification bell is drawn or
  stubbed, because every module behind them stays on the legacy application during cutover
  (AAP 0.9.2, AAP 0.10.5 item 8).

  The routed screen sits beside the breadcrumb's `.container-fluid`, not inside it: each screen
  template already opens its own page container (`features/clients/client-actions`, `features/loans/
  loan-edit`, the savings screens), so wrapping the outlet here would nest two containers and double
  the page gutters.

  No style attribute, no hex value and no dimension appears in this file (Rule 1 clause 6): the navbar
  bar, the content surface, the crumb and the alert are the global rules of
  web-ng/src/styles.scss and Bootstrap 3's own classes.
-->
<app-navbar [userName]="displayName()" />

<!--
  The idle warning, shown from `IdleService.warning$` until activity, "Stay signed in", the timeout or
  the end of the session dismisses it (AAP 0.1.1 requirement 1: a 10-second warning before logout).

  Its sentence is English in the template, and deliberately not a translation key. No idle or
  session-expiry key exists to translate: `app/global-translations/locale-en.json` carries only
  `label.message.password.expired`, and the legacy application never rendered an ng-idle warning at
  all — its `$idleTimeout` handler logged out silently (`app/scripts/controllers/main/
  MainController.js:139-143`). Inventing a `label.*` key here would render as humanised placeholder
  text through the missing-translation handler, which is exactly what that handler exists to prevent,
  and adding one to the frozen legacy bundles would change files the migration reads in place
  (Rule 1 clause 6). The difference from legacy is therefore stated here rather than smuggled into the
  key space.
-->
@if (idleWarning()) {
  <div class="alert alert-warning" role="alert">
    <span>You have been inactive and will be signed out shortly.</span>
    <button type="button" class="btn btn-sm btn-primary" (click)="staySignedIn()">Stay signed in</button>
  </div>
}

<div class="content-wrapper">
  <div class="container-fluid">
    <!-- The trail: the caller's `breadcrumb` input, or the active route's `data['breadcrumb']` keys
         translated into labels (AAP 0.2.3 `Breadcrumb`). An empty trail renders nothing at all. -->
    <app-breadcrumb [items]="breadcrumbItems()" />
  </div>

  <!-- The active route's screen. It owns its own page container and its own cards. -->
  <router-outlet />
</div>
