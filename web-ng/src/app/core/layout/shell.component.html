<!--
  The signed-in shell (AAP 0.2.3 `AppShell`, AAP 0.7.1 and AAP 0.8.2 "Shell and navigation"), which
  `app.routes.ts` renders behind its authenticated layout route.

  Order is the design's: the navigation bar, then the idle warning while a session is about to expire,
  then the content surface holding the breadcrumb and the routed screen. No left icon rail, no
  Accounting / Reports / Admin destination, no hamburger and no notification bell is drawn or stubbed,
  because every module behind them stays on the legacy application during cutover (AAP 0.9.2,
  AAP 0.10.5 item 8).

  The surface is also the page's `main` landmark. The login screen carries its own, and every
  authenticated screen mounts here, so this is the only place that can give them one; the change is
  semantic only, because the global rule is keyed to the class, so the background paint, the contained
  gutters and the outlet's position are exactly what they were.

  The routed screen sits beside the breadcrumb's `.container-fluid`, not inside it: the screens that
  need a page container open their own (`features/clients/client-actions`, `features/loans/
  loan-edit`, the savings screens), so a wrapper here would nest two containers and double the page
  gutters on every one of them. This template therefore owns the surface, and each screen owns its
  own gutter inside it.

  No style attribute, no colour literal and no dimension appears in this file (Rule 1 clause 6): the
  navbar's bar, the content surface, the crumb and the alert are the global rules of
  web-ng/src/styles.scss — tokens color-app-bg, color-brand-blue, color-rule and color-section-rule —
  plus Bootstrap 3's own classes.
-->
<app-navbar [userName]="displayName()" />

<!--
  The idle warning, shown from `IdleService.warning$` until activity, "Stay signed in", the timeout or
  the end of the session dismisses it (AAP 0.1.1 requirement 1: a 10-second warning before logout).

  Its sentence is English in the template, and deliberately not a translation key. No idle or
  session-expiry key exists to translate: `app/global-translations/locale-en.json` carries only
  `label.message.password.expired`, and the legacy application never rendered an ng-idle warning at
  all — its `$idleTimeout` handler logged out silently (`app/scripts/controllers/main/
  MainController.js:139-143`). Inventing a `label.*` key here would render as humanised placeholder
  text through the missing-translation handler, which is exactly what that handler exists to prevent,
  and adding one to the frozen legacy bundles would change files the migration reads in place
  (Rule 1 clause 6). The difference from legacy is therefore stated here rather than smuggled into the
  key space.
-->
@if (idleWarning()) {
  <div class="alert alert-warning" role="alert">
    <span>You have been inactive and will be signed out shortly.</span>
    <button type="button" class="btn btn-sm btn-primary" (click)="staySignedIn()">Stay signed in</button>
  </div>
}

<main class="content-wrapper">
  <div class="container-fluid">
    <!-- The trail: the caller's `breadcrumb` input, or the active route's `data['breadcrumb']` keys
         translated into labels (AAP 0.2.3 `Breadcrumb`). An empty trail renders nothing at all, and
         the record screen renders its own crumb, so a route that declares none shows none here. -->
    <app-breadcrumb [items]="breadcrumbItems()" />
  </div>

  <!-- The active route's screen: its own cards, and its own page container where it needs one. -->
  <router-outlet />
</main>
