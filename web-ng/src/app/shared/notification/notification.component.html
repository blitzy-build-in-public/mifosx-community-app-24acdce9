<!--
  One notice per queued message, stacked inside the widget's single `.notification-container`. The
  classes are the `.notification-container`/`.notification-*` rules of `web-ng/src/styles.scss` —
  the reproduction of the legacy `_notifications.scss` widget that the component inventory's
  `Notification` row names as this widget's visual specification — because those rules are what
  style this stack at its fixed top-right position and give each notice its per-kind accent bar.
  Bootstrap's alert classes are deliberately not emitted: the component mapping (AAP 0.5.2)
  assigns them to the inline validation and server error banner, a different widget. Each close
  control names the one notice it drops, and dismissal is the Angular `(click)` on `.close` with
  no Bootstrap JS.

  The notice body is Fineract's own text and stays untranslated (Rule 1 clause 3). The close
  control's accessible name is the application's own copy, though, so it resolves through the
  legacy bundle's existing `label.button.close` key — "Close", "Clôturer", "Cerrar" in the shipped
  en/fr/es bundles — rather than being the English literal a non-English user would hear (AAP
  0.1.1 requirement 1's i18n, AAP 0.7.4; Rule 1 clauses 3 and 6: an existing legacy key is reused,
  never invented, and no bundle is edited).
-->
<div class="notification-container">
  @for (message of messages(); track message.id) {
    <div
      class="notification"
      [class.notification-info]="message.kind === 'info'"
      [class.notification-success]="message.kind === 'success'"
      [class.notification-error]="message.kind === 'error'"
      role="alert"
    >
      <button
        type="button"
        class="close"
        [attr.aria-label]="'label.button.close' | translate"
        (click)="dismiss(message.id)"
      >
        <span aria-hidden="true">&times;</span>
      </button>{{ message.message }}
    </div>
  }
</div>
