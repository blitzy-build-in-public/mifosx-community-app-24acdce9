<!--
  The language switcher row (AAP 0.2.3 `LanguageSwitcher`; the login screen's row on Figma node `1:5` and the navbar's on node `1:3`): a label and a native `<select>`, which is the Angular-native
  replacement for the jQuery plugin the request forbids (AAP 0.10.5 item 2). The structure is the one both screens carried inline before this component existed: a `.language-switcher` wrapper — the global
  rule in `web-ng/src/styles.scss` gives the label the design's 13px `color-text-strong` size and the select its 24px height over Bootstrap's `.btn.btn-default.btn-xs` bordered look (Rule 1 clause 6) —
  the label, and the select beside it; this template therefore declares no style attribute, no colour and no dimension. The label's text is the caller's key — the navbar reads "Language" and the login
  screen legacy's "Change language:", each a key the shipped bundles already carry — and `[for]` points at the select's own id, so the label names the control it sits beside.

  `#picker` is the template reference `onLangChange` reads twice: the value it reports is typed (`HTMLSelectElement.value`, so no `$any(...)` cast is needed — Rule 1 clause 4), and the element is handed
  back as well, because a bundle that fails to load leaves the control on a value its `[value]` binding will never rewrite and the component has to write it back itself. The `[value]` binding is applied
  before the `@for` options exist on the first render pass, so each option also states whether it is the active one and the control shows the active language even when the configured default is not first
  in the list; each option's text is the language code the bundles are named by, which is also how the parity page objects recognise the control.
-->
<div class="language-switcher">
  <label [for]="selectId()">{{ labelKey() | translate }}</label>
  <select
    #picker
    [id]="selectId()"
    class="btn btn-default btn-xs"
    [value]="current()"
    (change)="onLangChange(picker.value, picker)"
  >
    @for (lang of langs(); track lang) {
      <option [value]="lang" [selected]="lang === current()">{{ lang }}</option>
    }
  </select>
</div>
